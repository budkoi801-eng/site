<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>maksimalni.top</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #1a1a1a, #000000 80%);
      font-family: 'Nunito', sans-serif;
      color: #ffffff;
      overflow: hidden;
      position: relative;
    }

    .container {
      text-align: center;
      padding: 20px;
      z-index: 1;
    }

    h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(2rem, 5vw, 4rem);
      font-weight: 700;
      letter-spacing: 0.1em;
      margin-bottom: 16px;
      text-shadow: 0 0 10px #00ffea, 0 0 20px #00ffea33;
    }

    p {
      font-family: 'Nunito', sans-serif;
      font-size: 1.2rem;
      opacity: 0.9;
      margin-bottom: 40px;
      letter-spacing: 0.05em;
      text-shadow: 0 0 6px #ffffff33;
    }

    .hippos {
      display: flex;
      justify-content: center;
      gap: 16px;
      font-size: 2rem;
    }

    .hippo {
      animation: jump 1.6s ease-in-out infinite;
    }

    .hippo:nth-child(2) { animation-delay: 0.2s; }
    .hippo:nth-child(3) { animation-delay: 0.4s; }
    .hippo:nth-child(4) { animation-delay: 0.6s; }

    @keyframes jump {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-25px); }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>maksimalni.top</h1>
    <p>Сайт скоро станет доступен</p>
    <div class="hippos">
      <span class="hippo">🦛</span>
      <span class="hippo">🦛</span>
      <span class="hippo">🦛</span>
      <span class="hippo">🦛</span>
    </div>
  </div>

</body>
</html>
